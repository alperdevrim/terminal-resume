# All resume content lives here. Edit this file to update the site — no
# component code contains personal/resume content. See README.md for the
# full schema documentation.

profile:
  name: "John Doe"
  title: "Software Engineer"
  location: "Türkiye"
  summary: >-
    Software engineer who enjoys building small, well-crafted tools and
    polished developer experiences. This site is one of them — replace this
    summary, and everything else in this file, with your own story.

experience:
  - company: "Example Corp"
    position: "Senior Software Engineer"
    color: cyan
    start_date: "2023"
    end_date: "Present"
    description:
      - "Led design and delivery of a core internal platform used by several product teams"
      - "Mentored junior engineers and helped raise the bar on code review practices"
      - "Drove adoption of infrastructure-as-code, cutting environment setup time significantly"
    technologies:
      - TypeScript
      - React
      - Node.js
      - Terraform
      - AWS

  - company: "Previous Company"
    position: "Software Engineer"
    color: purple
    start_date: "2020"
    end_date: "2023"
    description:
      - "Built and maintained customer-facing web applications"
      - "Collaborated with design and product to ship features end-to-end"
      - "Introduced automated testing that reduced regressions in production"
    technologies:
      - JavaScript
      - Python
      - Docker
      - PostgreSQL

education:
  - institution: "Your University"
    degree: "B.Sc. in Computer Engineering"
    start_date: "2016"
    end_date: "2020"
    details:
      - "Focused on distributed systems and software architecture"

# A skill is either a bare string or a mapping. Add `level` (0-100) to draw a
# proficiency meter, and `color` to accent it. The two forms can be mixed: a
# category renders as a compact list until at least one skill has a level,
# then every skill in it gets its own row.
skills:
  core:
    - name: "TypeScript"
      level: 90
      color: blue
    - name: "Python"
      level: 75
      color: yellow
    - name: "Go"
      level: 55
      color: cyan
  frontend:
    - React
    - Vite
    - CSS
  backend:
    - Node.js
    - REST APIs
    - PostgreSQL
  infrastructure:
    - Docker
    - Terraform
    - AWS
    - GitHub Actions

# Spoken languages. Same optional `level`/`color` as skills, plus a free-text
# `note` for things like CEFR levels.
languages:
  - name: "English"
    level: 100
    note: "Native"
    color: green
  - name: "Spanish"
    level: 60
    note: "B2"
    color: orange

projects:
  - name: "terminal-resume"
    description: "This site — a resume that behaves like a real terminal, driven entirely by YAML data."
    technologies:
      - TypeScript
      - React
      - Vite
    url: "https://github.com/example/terminal-resume"

  - name: "Project Two"
    description: "A short description of a project worth showing off."
    technologies:
      - Python
      - Docker
    url: "https://example.com"

  - name: "Project Three"
    description: "Another project. Replace with something real."
    technologies:
      - Go
    url: null

certifications:
  - name: "Example Certification"
    issuer: "Issuing Organization"
    date: "2025"

contact:
  email: "john.doe@example.com"
  phone: null
  website: null

socials:
  github: "https://github.com/example"
  linkedin: "https://linkedin.com/in/example"

# Terminal chrome (not resume content).
#
#   user / host  the "user@host" in the user@host:~$ prompt. Either can be
#                null to fall back to a slug of profile.name (user) or
#                "resume" (host) — e.g. user: "root", host: "example"
#                renders root@example:~$.
#   welcome      the line printed once the boot sequence finishes. Use
#                {name} to insert profile.name. Null falls back to
#                "Welcome to {name}'s interactive resume."
terminal:
  user: "root"
  host: "resume"
  welcome: "Welcome to {name}'s interactive resume."
  # Where `exit` sends visitors. Null disables the command's redirect.
  exit_url: "https://example.com"
  # Per-command on/off switches. Every command in the registry is listed
  # here, so this doubles as the canonical list of what the terminal knows.
  # Commands are opt-out: deleting a line leaves that command enabled.
  # Disabling `help` is allowed, but leaves visitors no way to discover
  # the others.
  commands:
    help: true
    about: true
    experience: true
    education: true
    skills: true
    languages: true
    projects: true
    certifications: true
    contact: true
    socials: true
    history: true
    clear: true
    exit: true
    whoami: false
    ls: false
    cat: false
