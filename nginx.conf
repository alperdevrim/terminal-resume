# Cache-Control is derived here rather than set inside per-location
# add_header directives. nginx drops every inherited add_header as soon as a
# block declares one of its own, so a `location` that set only Cache-Control
# would silently strip the security headers below from exactly the responses
# that need them. Keeping every add_header at server level avoids that.
#
# Vite emits content-hashed filenames under assets/, so those URLs can never
# go stale and are cached indefinitely. Everything else — index.html above
# all — must not be cached, or clients keep loading a stale bundle after a
# deploy.
map $uri $cache_control {
    default    "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HSTS is deliberately omitted: this container serves plain HTTP behind a
    # TLS-terminating proxy, which is where that header belongs.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container healthcheck target, kept in its own location so it stays
    # reachable if the site itself is ever put behind a redirect.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
