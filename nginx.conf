server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sent on every response. HSTS is deliberately omitted: this container
    # serves plain HTTP behind a TLS-terminating proxy, which is where that
    # header belongs.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames under assets/, so those URLs can
    # never go stale — cache them indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the one file whose URL is stable, so it must not be
    # cached; otherwise clients keep loading a stale bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
